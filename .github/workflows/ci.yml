name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: clpe, POSTGRES_PASSWORD: clpe, POSTGRES_DB: clpe}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clpe" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - name: Tests (SQLite)
        working-directory: backend
        run: pytest -q
      - name: Tests (PostgreSQL)
        working-directory: backend
        env: {CLPE_DATABASE_URL: "postgresql+psycopg://clpe:clpe@localhost:5432/clpe"}
        run: pytest -q

  lab-engine-docker-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - name: Real Docker lab (isolated network, nmap scan, console, cleanup)
        working-directory: backend
        env: {CLPE_E2E_ATTACKER_IMAGE: "instrumentisto/nmap:latest"}
        run: python scripts/e2e_docker.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
