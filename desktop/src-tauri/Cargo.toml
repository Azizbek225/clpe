[package]
name = "clpe-desktop"
version = "0.1.0"
description = "CLPE Desktop — Cybersecurity Learning & Practice Environment"
edition = "2021"
license = "Proprietary"

[lib]
name = "clpe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
