course:
  slug: networking-fundamentals
  title: Networking Fundamentals
  description: OSI/TCP-IP modeli, IP manzillash, portlar va tarmoqni skanerlash asoslari.
  difficulty: beginner
  estimated_duration: 720
  objectives:
    - OSI va TCP/IP qatlamlarini bilish
    - CIDR bo'yicha subnet hisoblash
    - nmap bilan host va portlarni aniqlash
  translations:
    ru: {title: Основы сетей, description: "Модели OSI/TCP-IP, IP-адресация, порты и основы сканирования."}
    en: {title: Networking Fundamentals, description: "OSI/TCP-IP, IP addressing, ports and scanning basics."}
modules:
  - slug: models-addressing
    title: Modellar va manzillash
    level: beginner
    description: OSI, TCP/IP, IPv4 va CIDR.
    lessons:
      - slug: osi-tcpip
        title: OSI va TCP/IP modellari
        duration: 20
        content: |
          # OSI va TCP/IP

          | OSI | TCP/IP | Misollar |
          |---|---|---|
          | 7 Application, 6 Presentation, 5 Session | Application | HTTP, DNS, SSH |
          | 4 Transport | Transport | TCP, UDP |
          | 3 Network | Internet | IP, ICMP |
          | 2 Data Link, 1 Physical | Link | Ethernet, Wi-Fi, ARP |

          Hujum va himoya vositalari ko'pincha aniq bir qatlamda ishlaydi: masalan, ARP spoofing — 2-qatlam,
          SYN flood — 4-qatlam, SQL injection — 7-qatlam.
      - slug: ipv4-cidr
        title: IPv4 va CIDR
        duration: 25
        content: |
          # IPv4 va CIDR

          `10.200.0.0/24` — 24 bit tarmoq qismi, 8 bit host qismi → 256 manzil, 254 ta host.

          ```text
          /24 = 255.255.255.0   → 254 host
          /16 = 255.255.0.0     → 65 534 host
          /30 = 255.255.255.252 → 2 host
          ```

          CLPE laboratoriyalarida har bir talabaga alohida `/24` tarmoq ajratiladi.
  - slug: scanning
    title: Tarmoqni skanerlash
    level: intermediate
    description: TCP handshake, nmap skan turlari va xizmatlarni aniqlash.
    lessons:
      - slug: tcp-handshake
        title: TCP handshake va port holatlari
        duration: 20
        content: |
          # TCP uch bosqichli handshake

          ```text
          Client  --SYN-->      Server
          Client  <--SYN/ACK--  Server   (port ochiq)
          Client  <--RST--      Server   (port yopiq)
          ```

          nmap port holatlari: **open**, **closed**, **filtered** (firewall javob bermayapti).
      - slug: nmap-basics
        title: nmap asoslari
        duration: 30
        content: |
          # nmap

          ```bash
          nmap -sn 10.200.0.0/24          # tirik hostlar
          nmap -sS -p- 10.200.0.10        # barcha TCP portlar (SYN skan)
          nmap -sV -sC 10.200.0.10        # xizmat versiyalari + standart skriptlar
          nmap -oX scan.xml ...           # XML natija (CLPE topologiyasiga import qilinadi)
          ```

          > ⚠️ Skanerlash faqat ruxsat berilgan tarmoqlarda qonuniy. CLPE laboratoriyalari aynan shu uchun.
      - slug: lab-network-scan
        title: "Amaliyot: tarmoqni skanerlash"
        lesson_type: lab
        lab: network-scan-001
        duration: 90
        content: Izolyatsiyalangan tarmoqni skanerlang va topologiya grafigini quring.
      - slug: lab-pivot
        title: "Amaliyot: segmentlangan tarmoq"
        lesson_type: lab
        lab: pivot-segments-001
        duration: 150
        content: DMZ orqali ichki tarmoqni o'rganing.
    quiz:
      title: Skanerlash testi
      passing_score: 70
      questions:
        - q: "/24 tarmoqda nechta foydalanish mumkin bo'lgan host manzili bor?"
          options: ["256", "254", "255", "128"]
          correct: [1]
        - q: Port yopiq bo'lsa server SYN paketiga nima bilan javob beradi?
          options: [SYN/ACK, RST, Hech narsa, FIN]
          correct: [1]
        - q: Xizmat versiyasini aniqlash uchun nmap kaliti
          options: ["-sn", "-sV", "-Pn", "-F"]
          correct: [1]
        - q: SSH standart porti
          options: ["21", "22", "23", "25"]
          correct: [1]
        - q: SQL injection OSI modelining qaysi qatlamiga tegishli?
          options: [Transport, Network, Application, Data Link]
          correct: [2]
  - slug: services-defense
    title: Xizmatlar va tarmoq himoyasi
    level: intermediate
    description: Mashhur portlar, DNS, firewall va xizmatlarni sanab chiqish.
    lessons:
      - slug: common-ports
        title: Mashhur portlar va xizmatlar
        duration: 20
        content: |
          # Mashhur portlar

          | Port | Xizmat | Izoh |
          |---|---|---|
          | 21 | FTP | parol ochiq matnda |
          | 22 | SSH | shifrlangan boshqaruv |
          | 23 | Telnet | ochiq matn — ishlatmang |
          | 25 | SMTP | pochta |
          | 53 | DNS | UDP/TCP |
          | 80 / 443 | HTTP / HTTPS | web |
          | 139 / 445 | SMB | Windows/Samba fayl almashish |
          | 3306 | MySQL | |
          | 3389 | RDP | Windows masofaviy ish stoli |
          | 6667 | IRC | |
      - slug: dns
        title: DNS qanday ishlaydi
        duration: 20
        content: |
          # DNS

          Domen nomini IP manzilga aylantiradi. Yozuv turlari: `A`, `AAAA`, `MX`, `CNAME`, `TXT`, `NS`.

          ```bash
          dig example.com A
          dig -x 10.200.0.10        # teskari (PTR) so'rov
          ```
          Hujumlar: DNS spoofing, zone transfer (`dig axfr`), DNS tunnelling. Himoya: DNSSEC, transferni cheklash.
      - slug: firewalls
        title: Firewall va segmentatsiya
        duration: 20
        content: |
          # Firewall

          Paketlarni qoidalar asosida o'tkazadi yoki to'xtatadi. **Default deny** — ruxsat berilmagan hamma narsa taqiqlanadi.

          ```bash
          sudo ufw default deny incoming
          sudo ufw allow 22/tcp
          sudo ufw enable
          ```
          **Segmentatsiya:** DMZ (tashqariga ochiq serverlar) va ichki tarmoq ajratiladi — CLPE'dagi
          "pivot-segments-001" laboratoriyasi aynan shunday tuzilgan.
      - slug: lab-enum
        title: "Amaliyot: xizmatlarni sanab chiqish"
        lesson_type: lab
        lab: network-enum-001
        duration: 75
        content: Eski serverdagi xizmat versiyalarini aniqlang.
      - slug: lab-recon
        title: "Amaliyot: korporativ tarmoq razvedkasi"
        lesson_type: lab
        lab: recon-multi-host-001
        duration: 120
        content: To'rt serverli tarmoqni xaritaga tushiring.
    quiz:
      title: Xizmatlar va himoya testi
      passing_score: 70
      questions:
        - {q: "RDP standart porti", options: ["22", "445", "3389", "8080"], correct: [2]}
        - {q: "Parolni ochiq matnda uzatadigan protokollar", type: multiple, options: [Telnet, FTP, SSH, HTTPS], correct: [0, 1]}
        - {q: "Pochta serverini ko'rsatuvchi DNS yozuvi", options: [A, MX, CNAME, PTR], correct: [1]}
        - {q: "IP'dan domen nomini topish", options: ["A so'rov", "PTR (teskari) so'rov", "MX so'rov", "TXT so'rov"], correct: [1]}
        - {q: "Default deny siyosati", options: ["Hammasi ruxsat", "Faqat ruxsat berilgani o'tadi", "Faqat 80-port yopiq", "Faqat ICMP ruxsat"], correct: [1]}
        - {q: "DMZ'ning maqsadi", options: ["Ichki serverlarni internetga ochish", "Tashqi xizmatlarni ichki tarmoqdan ajratish", "Wi-Fi tezligini oshirish", "DNS'ni tezlashtirish"], correct: [1]}
        - {q: "SMB qaysi portlarda?", type: multiple, options: ["139", "445", "443", "25"], correct: [0, 1]}
        - {q: "DNS zone transferni tekshirish buyrug'i", options: ["dig axfr", "nmap -sn", "ping -c", "whois"], correct: [0]}
        - {q: "MySQL standart porti", options: ["1433", "5432", "3306", "27017"], correct: [2]}
        - {q: "DNS ma'lumotlarini imzolash texnologiyasi", options: [DNSSEC, DHCP, SNMP, ARP], correct: [0]}
